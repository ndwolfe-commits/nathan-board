name: snooze-sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync snooze state from beacon
        run: python3 .github/snooze_sync.py
      - name: Commit if changed
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add snooze-state.json
          git diff --cached --quiet || git commit -m "snooze state sync"
          git push
